<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>บันทึกสินค้า · Prathan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a0a0a'/><rect x='24' y='30' width='52' height='40' rx='6' fill='none' stroke='white' stroke-width='7'/><circle cx='50' cy='50' r='9' fill='white'/></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><rect x='24' y='30' width='52' height='40' rx='6' fill='none' stroke='white' stroke-width='7'/><circle cx='50' cy='50' r='9' fill='white'/></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ ตัวแปรธีม ============ */
:root{
  --ink:#0a0a0a; --ink-2:#1c1c1c;
  --bg:#ffffff; --bg-2:#f4f4f5; --bg-3:#ebebed;
  --line:#e2e2e5; --line-2:#d2d2d7;
  --muted:#9a9aa2; --muted-2:#6c6c74;
  --warn:#b45309; --warn-bg:#fef3c7;
  --info:#1d4ed8; --info-bg:#dbeafe;
  --ok:#15803d;   --ok-bg:#dcfce7;
  --danger:#b91c1c;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-text-size-adjust:100%; font-size:15px; line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:3px solid var(--bg)}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sec-label{color:var(--muted);font-size:13.5px;font-weight:600;letter-spacing:.01em;margin:0 0 12px}

/* ============ หัวเรื่อง ============ */
header.top{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:14px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:#fff;font-size:13px;flex:none}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.top-row .spacer{flex:1}
.nav{display:flex;gap:4px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:1px solid transparent;background:transparent;color:var(--muted-2);
  padding:7px 13px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:.14s;
}
.nav button:hover{background:var(--bg-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--ink);color:#fff}
.nav .pill{background:rgba(0,0,0,.08);border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;min-width:20px;text-align:center}
.nav button[aria-current="true"] .pill{background:rgba(255,255,255,.22)}
.nav .pill.hot{background:var(--warn-bg);color:var(--warn)}

/* ============ ปุ่ม ============ */
.btn{
  border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);
  padding:9px 15px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;
  transition:.14s;white-space:nowrap;
}
.btn:hover{background:var(--bg-2)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-2)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted-2)}
.btn-ghost:hover{background:var(--bg-2);color:var(--ink)}
.btn-danger{color:var(--danger);border-color:#f0caca;background:#fff}
.btn-danger:hover{background:#fef2f2}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ============ ภาพรวม ============ */
main{padding:22px 0 90px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;min-height:88px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.stat.light{background:var(--bg-2);color:var(--ink)}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:13px;opacity:.72;font-weight:500}
.stat.clickable{cursor:pointer;transition:.15s}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

/* ============ แถบเครื่องมือ ============ */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
select.sortsel{padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;font-weight:600;font-size:13.5px}

/* ============ รายการสินค้า ============ */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{
  border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;
  display:flex;flex-direction:column;transition:.15s;align-self:start;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card .thumb{height:172px;background:var(--bg-2);position:relative;overflow:hidden;cursor:pointer}
.card .thumb.no-img{background:repeating-linear-gradient(45deg,var(--bg-2),var(--bg-2) 10px,#f9f9fa 10px,#f9f9fa 20px);border-bottom:1px solid var(--line)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .none{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:13px;gap:4px;text-align:center}
.card .thumb .count{position:absolute;right:8px;bottom:8px;background:rgba(10,10,10,.82);color:#fff;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px}
.card .body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.card .code{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.card .meta{font-size:13px;color:var(--muted-2);display:flex;flex-wrap:wrap;gap:4px 10px}
.card .repl{font-size:12.5px;background:var(--bg-2);border-radius:8px;padding:6px 9px;color:var(--muted-2)}
.card .repl b{color:var(--ink);font-weight:600}
.card .foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg-3);color:var(--muted-2);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.mute{background:var(--bg-3);color:var(--muted-2)}
.tag.dark{background:var(--ink);color:#fff}

.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:46px 24px;text-align:center;color:var(--muted-2)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ============ คิวถ่ายรูป (แถวแนวนอน) ============ */
.qrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:#fff;transition:.15s}
.qrow:hover{border-color:var(--line-2)}
.qrow .q-thumb{width:56px;height:56px;border-radius:var(--r-sm);background:var(--bg-2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:11px}
.qrow .q-thumb img{width:100%;height:100%;object-fit:cover}
.qrow .q-main{flex:1;min-width:0}
.qrow .q-main h4{margin:0;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .q-main p{margin:2px 0 0;font-size:12.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .q-act{display:flex;gap:6px;flex:none}
.qlist{display:flex;flex-direction:column;gap:9px}
.age{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg-3);color:var(--muted-2)}
.age.old{background:#fee2e2;color:#b91c1c}

/* ============ Drawer / ฟอร์ม ============ */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:60;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:61;right:0;top:0;bottom:0;width:min(560px,100%);
  background:#fff;box-shadow:-20px 0 60px -20px rgba(0,0,0,.3);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer .d-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.drawer .d-head h2{margin:0;font-size:17px;font-weight:700;flex:1;letter-spacing:-.01em}
.drawer .d-body{overflow-y:auto;padding:18px;flex:1;-webkit-overflow-scrolling:touch}
.drawer .d-foot{display:flex;gap:9px;padding:14px 18px;border-top:1px solid var(--line);flex:none;background:#fff;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.drawer .d-foot .spacer{flex:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field.col2{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted-2)}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{
  padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff;width:100%;
}
.field textarea{min-height:78px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.field .err{font-size:12px;color:var(--danger);font-weight:600}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.hint{font-size:12px;color:var(--muted)}

/* ============ รูปภาพ ============ */
.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r);padding:18px;text-align:center;
  color:var(--muted-2);font-size:13.5px;transition:.15s;cursor:pointer;background:var(--bg-2)
}
.drop:hover,.drop.over{border-color:var(--ink);background:var(--bg-3);color:var(--ink)}
.drop b{display:block;color:var(--ink);font-size:14px;font-weight:700;margin-bottom:3px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;margin-top:12px}
.imgs figure{margin:0;position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--bg-2);border:1px solid var(--line)}
.imgs img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.imgs .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:99px;border:none;background:rgba(10,10,10,.75);color:#fff;font-size:14px;display:grid;place-items:center;line-height:1}
.imgs .star{position:absolute;top:4px;left:4px;height:24px;padding:0 7px;border-radius:99px;border:none;background:rgba(10,10,10,.75);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.imgs .cover{position:absolute;bottom:0;left:0;right:0;background:rgba(10,10,10,.8);color:#fff;font-size:10.5px;font-weight:700;text-align:center;padding:2px}
.prog{height:4px;background:var(--bg-3);border-radius:99px;overflow:hidden;margin-top:10px;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .15s}

/* ============ Lightbox ============ */
.lb{position:fixed;inset:0;z-index:80;background:rgba(8,8,8,.94);display:none;place-items:center}
.lb.on{display:grid}
.lb img{max-width:94vw;max-height:82vh;object-fit:contain;border-radius:8px}
.lb .lb-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;font-size:13px}
.lb .lb-bar .spacer{flex:1}
.lb .lb-btn{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.lb .nav-l,.lb .nav-r{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);border:none;color:#fff;width:44px;height:44px;border-radius:99px;font-size:20px}
.lb .nav-l{left:14px} .lb .nav-r{right:14px}

/* ============ Toast ============ */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 17px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);animation:pop .2s}
.toast.bad{background:var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}

/* ============ FAB (มือถือ) ============ */
.fab{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:50;
  width:54px;height:54px;border-radius:99px;background:var(--ink);color:#fff;border:none;
  font-size:26px;display:none;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)
}

/* ============ หน้าข้อมูล/สำรอง ============ */
.panel{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
.panel p{margin:0 0 12px;font-size:13.5px;color:var(--muted-2)}
.panel .row{display:flex;gap:9px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted-2)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.dark-note{background:var(--ink);color:#fff;border-radius:var(--r);padding:18px 20px;font-size:13.5px;line-height:1.7}
.dark-note b{font-weight:700} .dark-note .t{font-size:15px;font-weight:700;display:block;margin-bottom:6px}
.dark-note .btn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.dark-note .btn:hover{background:rgba(255,255,255,.26)}
footer{color:var(--muted);font-size:12.5px;padding:26px 0;text-align:center}

@media (max-width:700px){
  .wrap{padding:0 14px}
  .list{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .stat b{font-size:24px}
  .fab{display:grid}
  .add-desktop{display:none}
  .drawer{width:100%;top:auto;height:94vh;border-radius:18px 18px 0 0;transform:translateY(102%)}
  .drawer.on{transform:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <span class="mark">P</span>
        <span>บันทึกสินค้า<small>Prathan · เก็บข้อมูลในเครื่องคุณ</small></span>
      </div>
      <span class="spacer"></span>
      <button class="btn btn-primary add-desktop" id="btnAdd">+ เพิ่มสินค้า</button>
    </div>
    <nav class="nav" id="nav">
      <button data-view="overview">ภาพรวม</button>
      <button data-view="items" aria-current="true">รายการสินค้า <span class="pill" id="pillItems">0</span></button>
      <button data-view="queue">คิวถ่ายรูป <span class="pill hot" id="pillQueue">0</span></button>
      <button data-view="data">ข้อมูล &amp; สำรอง</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<button class="fab" id="fab" aria-label="เพิ่มสินค้า">+</button>

<div class="scrim" id="scrim"></div>

<section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="d-head">
    <h2 id="dTitle">เพิ่มสินค้า</h2>
    <button class="btn btn-ghost btn-sm" id="dClose">ปิด</button>
  </div>
  <div class="d-body" id="dBody"></div>
  <div class="d-foot">
    <button class="btn btn-danger btn-sm" id="dDelete" style="display:none">ลบรายการ</button>
    <span class="spacer"></span>
    <button class="btn" id="dCancel">ยกเลิก</button>
    <button class="btn btn-primary" id="dSave">บันทึก</button>
  </div>
</section>

<div class="lb" id="lb">
  <div class="lb-bar">
    <span id="lbCap"></span><span class="spacer"></span>
    <button class="lb-btn" id="lbDl">ดาวน์โหลด</button>
    <button class="lb-btn" id="lbClose">ปิด ✕</button>
  </div>
  <button class="nav-l" id="lbPrev">‹</button>
  <img id="lbImg" alt="">
  <button class="nav-r" id="lbNext">›</button>
</div>

<div class="toasts" id="toasts"></div>
<datalist id="brands"></datalist>

<script src="schema.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing || reg.waiting;
        if (nw) nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            window.APP && APP.toast('มีเวอร์ชันใหม่ — รีเฟรชเพื่ออัปเดต');
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
</html>
